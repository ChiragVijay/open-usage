[package]
name = "open-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native, local-first view of AI usage, cost, and limits"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:tray-icon", "dep:rfd", "dep:open"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
urlencoding = "2"
gpui = { version = "=0.2.2", optional = true }
tray-icon = { version = "0.21", optional = true }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "open-usage"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "usage"
path = "src/bin/usage.rs"

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true

